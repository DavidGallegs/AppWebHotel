services:
  # 1. Base de datos
  base_datos:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql_datos:/var/lib/mysql
    networks:
      - redOne

# 2. PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment: 
      - PMA_HOST=base_datos
    networks:
      - redOne
    depends_on:
      - base_datos

  # 3. BackEnd(Laravel)
  backend:
    build: 
      context: ./backend                   # La carpeta donde vive el código PHP
      dockerfile: ../docker/php.Dockerfile
    restart: always
    ports:
      - "8000:80"         
    networks:
      - redOne

  # 4. FrontEnd (Astro + React)
  frontend:
    build:
      context: ./frontend                  # La carpeta donde vive el código Astro
      dockerfile: ../docker/node.Dockerfile 
    env_file:                 
      - ./frontend/.env
    tty: true    
    restart: always                         
    ports:
      - "4321:4321"
    environment:
      - ASTRO_TELEMETRY_DISABLED=1
      - HOST=0.0.0.0
      - NODE_ENV=production
    command: node ./dist/server/entry.mjs
    networks:
      - redOne

networks:
  redOne:
    driver: bridge

volumes:
  mysql_datos: